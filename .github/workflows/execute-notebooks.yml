name: Execute Notebooks

on:
  push:
    branches: [main]
    paths:
      - '**/*.ipynb'
      - '**/*.csv'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy matplotlib seaborn scikit-learn scipy plotly cufflinks chardet nbconvert ipykernel
          pip install prophet
          pip install geopandas || echo "geopandas install failed, skipping"

      - name: Install Jupyter kernel
        run: python -m ipykernel install --user --name python3

      - name: Execute notebooks
        run: |
          set +e
          declare -a notebooks=(
            "campaign-performance/Campaign Performance.ipynb"
            "customer-segmentation/Customer Segmentation.ipynb"
            "conversion-eda/Conversion.EDA.ipynb"
            "site-traffic-forecast/Site-Traffic-Forecast.ipynb"
            "superstore-eda/Superstore.dataset_EDA.ipynb"
            "video-game-sales/Videogamesales.ipynb"
            "google-play-sql/GooglePlayStore_SQL.ipynb"
          )
          for nb in "${notebooks[@]}"; do
            dir=$(dirname "$nb")
            file=$(basename "$nb")
            echo "▶ Executing: $nb"
            cd "$dir"
            jupyter nbconvert --to notebook --execute --allow-errors --inplace \
              --ExecutePreprocessor.timeout=300 \
              --ExecutePreprocessor.kernel_name=python3 \
              "$file" && echo "✓ Done: $file" || echo "✗ Failed: $file (continuing)"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Commit executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '**/*.ipynb'
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "ci: auto-execute notebooks with outputs [skip ci]"
          git push
